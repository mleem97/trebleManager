[workspace]
resolver = "2"
members = [
    "crates/gsi-image",
    "crates/gsi-android",
    "crates/gsi-root-core",
    "crates/gsi-root-cli",
    "crates/gsi-config",
    "crates/gsi-workflow",
    "crates/gsi-update",
    "crates/gsi-fs",
    "crates/gsi-device",
    "crates/gsi-archive",
    "crates/gsi-registry",
    "crates/gsi-state",
    "crates/gsi-gates",
    "crates/gsi-diag",
    "crates/gsi-i18n",
    "crates/gsi-tool",
    "crates/gsi-root-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Central versions for this workspace (native workspace-inheritance).
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
slint = "1"
slint-build = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"
zip = "2"
