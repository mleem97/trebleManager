[workspace]
resolver = "2"
members = [
    "crates/gsi-image",
    "crates/gsi-android",
    "crates/gsi-root-core",
    "crates/gsi-root-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Central versions for this workspace (native workspace-inheritance;
# also recorded in /mnt/win/Repositories/.vendors/cargo.txt).
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
